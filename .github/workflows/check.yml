name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # Branches run once, through their PR; a newer run of the same PR or branch cancels the older one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Tests on all three desktop platforms (R04); lint and the build run once, on Linux (ESLint hung on the
    # Windows runner without a lockfile, 2026-10-26; lint does not depend on the OS).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: No drop secrets
        if: matrix.os == 'ubuntu-latest'
        run: node tools/no-drop-secrets.mjs

      - name: Unit tests
        run: npm test

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: npm run build

      - name: Standalone bundle check
        if: matrix.os == 'ubuntu-latest'
        run: BUNDLE_CHECK=1 npx vitest run tests/standalone.bundle.test.js
