name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Lint and tests on all three desktop platforms (R04); the build runs once, on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No lockfile yet (it lands with the lockfile issue); switch to `npm ci` then.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: npm run build
